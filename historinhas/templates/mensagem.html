{% extends "base.html" %}
{% block title %}{{ title }} · {{ settings.site_name }}{% endblock %}
{% block content %}
<div class="wrap narrow" style="padding:30px 16px 60px">
  <div class="card center">
    <h1>{{ title }}</h1>
    <p>{{ text }}</p>
    <p><a class="btn secondary" href="{{ link[0] if link else '/' }}">{{ link[1] if link else 'Voltar para o início' }}</a></p>
  </div>
</div>
{% endblock %}
