# Sobe tudo com: docker compose up -d --build
# Serviços: site (web), produção automática (worker), IA local (ollama) e HTTPS grátis (caddy).

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "historinhas.worker"]
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=15m
    volumes:
      - ollama:/root/.ollama

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  ollama:
  caddy_data:
  caddy_config:
